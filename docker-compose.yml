services:
  # 1. Le conteneur de la base de données MySQL
  db:
    image: mysql:8.0
    container_name: todo-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: todo_db
      MYSQL_USER: testUsername
      MYSQL_PASSWORD: testpasword
    ports:
      - "13300:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 2. Le conteneur de votre application Java / Spring Boot
  app:
    build: .
    container_name: todo-backend-java11
    ports:
      - "18060:8080"
    environment:
      # Spring Boot se connecte au service 'db' grâce au réseau Docker interne
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/todo_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&
      - SPRING_DATASOURCE_USERNAME=testUsername
      - SPRING_DATASOURCE_PASSWORD=testpasword
    depends_on:
      - db

volumes:
  db_data: